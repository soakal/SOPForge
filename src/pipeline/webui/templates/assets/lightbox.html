<div id="lightbox" hidden onclick="if(event.target===this)this.hidden=true,this.querySelector('img').src=''"><span class="close" onclick="lightbox.hidden=true;lightbox.querySelector('img').src=''">&times;</span><img alt=""></div><script>document.addEventListener('click',function(e){if(!e.target.classList.contains('shot'))return;e.preventDefault();var lb=document.getElementById('lightbox');lb.querySelector('img').src=e.target.src;lb.querySelector('img').alt=e.target.alt;lb.hidden=false;});document.addEventListener('keydown',function(e){if(e.key==='Escape'){var lb=document.getElementById('lightbox');lb.hidden=true;lb.querySelector('img').src='';}});</script>
