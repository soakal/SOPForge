<noscript><div class="grid2" style="margin-bottom:24px"><div class="card"><h2>Upload a capture session</h2><form method="post" action="/ui/upload" enctype="multipart/form-data"><div class="field"><label>Manifest (manifest.json)</label><input type="file" name="manifest_file" accept=".json" required></div><div class="field"><label>Screenshots (select every PNG)</label><input type="file" name="files" multiple required></div><div class="field"><label>Narration transcript &mdash; optional (.txt or .md)</label><input type="file" name="transcript_file" accept=".txt,.md,.json"></div><button type="submit">Upload</button></form></div><div class="card"><h2>Build from screenshots + transcript</h2><form method="post" action="/ui/build" enctype="multipart/form-data"><div class="field"><label>Title (optional)</label><input type="text" name="title" placeholder="My procedure"></div><div class="field"><label>Screenshots / images (in order)</label><input type="file" name="files" accept="image/*" multiple required></div><div class="field"><label>Transcript &mdash; optional (.txt or .md)</label><input type="file" name="transcript_file" accept=".txt,.md,.json"></div><button type="submit">Build document</button></form></div></div></noscript>
